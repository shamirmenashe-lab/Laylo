<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080e1a">
  <title>Laylo</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--teal:#0d9488;--teal2:#14b8a6;--bg:#080e1a;--s1:#0f1c2e;--s2:#162438;--border:#1e3347;--text:#e2e8f0;--muted:#5a7a94;--red:#ef4444;--r:14px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;direction:rtl}
    .screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 0;opacity:0;pointer-events:none;transition:opacity .2s}
    .screen.active{opacity:1;pointer-events:all}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;flex-shrink:0}
    .logo{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--teal2);letter-spacing:-.04em}
    .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);border:1px solid var(--border);padding:2px 7px;border-radius:20px}
    .bpm-chip{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal2);border:1px solid var(--teal);padding:3px 10px;border-radius:20px;cursor:pointer}
    .btn{border:none;border-radius:var(--r);font-family:'Heebo',sans-serif;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;user-select:none}
    .btn:active{opacity:.75;transform:scale(.97)}
    .btn-primary{background:var(--teal);color:#fff;font-size:16px;padding:16px 24px;width:100%}
    .btn-ghost{background:var(--s2);color:var(--text);font-size:15px;padding:14px 24px;width:100%;border:1px solid var(--border)}
    .btn-danger{background:rgba(239,68,68,.12);color:var(--red);font-size:15px;padding:14px 24px;width:100%;border:1px solid rgba(239,68,68,.2)}
    .gap{gap:10px;display:flex;flex-direction:column}
    .back-btn{font-size:22px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px}
    .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 24px}
    .sub{font-size:14px;color:var(--muted);line-height:1.6}
    .rec-indicator{width:12px;height:12px;border-radius:50%;background:var(--muted)}
    .rec-indicator.recording{background:var(--red);animation:blink 1s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
    .bpm-number{font-family:'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:var(--teal2);letter-spacing:-.04em}
    .bpm-label{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
    .adjust-row{display:flex;align-items:center;gap:8px}
    .adj-btn{height:48px;border-radius:10px;background:var(--s2);border:1px solid var(--border);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:'Heebo',sans-serif;padding:0 14px}
    .adj-btn:active{background:var(--teal);border-color:var(--teal)}
    .click-bars{display:flex;gap:6px;align-items:flex-end;height:32px}
    .click-bar{width:6px;border-radius:3px;background:var(--teal);transition:height .08s}
    .session-top-meta{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;flex-shrink:0}
    .session-proj-name{font-size:13px;font-weight:700;color:var(--teal2)}
    .session-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
    .session-tracks{flex:1;overflow-y:auto;padding:8px 0}
    .session-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px;color:var(--muted)}
    .session-empty .ic{font-size:46px;opacity:.3}
    .session-track-row{display:flex;align-items:center;padding:8px 16px;gap:8px;border-bottom:1px solid var(--border);position:relative}
    .session-track-row.recording-row{background:rgba(239,68,68,.06)}
    .session-track-row.click-row{background:rgba(13,148,136,.04)}
    .track-name{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text);width:46px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .track-ctrl{display:flex;gap:4px;flex-shrink:0}
    .tbtn{width:30px;height:30px;border-radius:50%;background:var(--s2);border:1px solid var(--border);font-size:13px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:background .15s,opacity .15s}
    .tbtn:active{transform:scale(.92)}
    .tbtn.rec{color:var(--red);border-color:rgba(239,68,68,.4)}
    .tbtn.rec.armed{background:var(--red);color:#fff;border-color:var(--red);animation:blink 1s infinite}
    .tbtn.locked{opacity:.28;pointer-events:none}
    .tbtn.play.playing{background:var(--teal);border-color:var(--teal);color:#fff}
    .ms-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
    .ms-btn{width:22px;height:22px;border-radius:4px;background:var(--s2);border:1px solid var(--border);font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;padding:0}
    .ms-btn.m-on{background:rgba(239,68,68,.2);color:var(--red);border-color:var(--red)}
    .ms-btn.s-on{background:rgba(13,148,136,.2);color:var(--teal2);border-color:var(--teal)}
    .session-canvas-wrap{flex:1;position:relative;height:46px;background:var(--s2);border-radius:8px;overflow:hidden}
    .session-waveform{width:100%;height:100%;display:block}
    .playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--teal2);pointer-events:none}
    .clk-bars{flex:1;display:flex;gap:4px;align-items:center;height:46px;padding:0 10px;background:var(--s2);border-radius:8px}
    .clk-bar{width:5px;height:14px;border-radius:3px;background:var(--teal);opacity:.5;transition:height .08s,opacity .08s}
    .row-rec-meta{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--red);background:var(--bg);padding:2px 8px;border-radius:10px}
    .add-track-wrap{padding:10px 16px;flex-shrink:0}
    .add-track-btn{width:100%;background:none;border:1px dashed var(--border);border-radius:12px;padding:12px;color:var(--muted);font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
    .add-track-btn:active{border-color:var(--teal);color:var(--teal)}
    .session-controls{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
    .sess-play-btn{width:44px;height:44px;border-radius:50%;background:var(--teal);border:none;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .sess-hint{flex:1;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
    .ai-bar{display:flex;gap:8px;align-items:center;padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--border);flex-shrink:0}
    .ai-input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--text);font-family:'Heebo',sans-serif;direction:rtl;outline:none}
    .ai-input:focus{border-color:var(--teal)}
    .ai-send-btn,.ai-mic-btn{width:38px;height:38px;border-radius:50%;border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .ai-send-btn{background:var(--teal)}
    .ai-mic-btn{background:var(--s2);color:var(--muted);border:1px solid var(--border)}
    .ai-mic-btn.listening{background:var(--red);color:#fff;animation:blink .5s infinite}
    .ai-response{font-size:12px;color:var(--teal2);padding:4px 16px;font-family:'IBM Plex Mono',monospace;min-height:20px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .od-review-layers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
    .od-layer-tag{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal2);border:1px solid var(--teal);padding:3px 10px;border-radius:20px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal-sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;transform:translateY(100%);transition:transform .25s ease-out;padding-bottom:max(24px,env(safe-area-inset-bottom))}
    .modal-overlay.open .modal-sheet{transform:translateY(0)}
    .modal-title{font-size:17px;font-weight:700;margin-bottom:6px}
    .modal-input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:16px;color:var(--text);font-family:'Heebo',sans-serif;direction:rtl;margin-bottom:4px;outline:none;margin-top:8px}
    .modal-input:focus{border-color:var(--teal)}
    .modal-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}
    .modal-row{display:flex;gap:10px;margin-top:12px}
    .modal-row .btn{flex:1}
  </style>
</head>
<body>

<!-- ══ BPM: ברוך הבא ══ -->
<div id="screen-bpm-welcome" class="screen">
  <div class="topbar"><span class="logo">laylo</span><span class="badge">sprint 5</span></div>
  <div class="center-screen">
    <div style="font-size:48px">🎸</div>
    <div style="font-size:26px;font-weight:900;line-height:1.2">נגן את השיר שלך<br>כמה פעמים</div>
    <div class="sub">תרגיש את הקצב.<br>לחץ "הפעל קליק" וכוון.</div>
  </div>
  <div class="bottom-bar" style="padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))"><button class="btn btn-primary" id="bpm-start">▶ הפעל קליק</button></div>
</div>

<!-- ══ BPM: כוונון ══ -->
<div id="screen-bpm-adjust" class="screen" style="align-items:center;text-align:center">
  <div class="topbar" style="width:100%"><button class="back-btn" id="bpm-adj-back">←</button><span></span></div>
  <div class="center-screen">
    <div class="click-bars"><div class="click-bar" style="height:8px" id="cb0"></div><div class="click-bar" style="height:8px" id="cb1"></div><div class="click-bar" style="height:8px" id="cb2"></div><div class="click-bar" style="height:8px" id="cb3"></div></div>
    <div class="bpm-label">BPM</div>
    <div class="bpm-number" id="bpm-adj-num">120</div>
    <div class="adjust-row">
      <button class="adj-btn" id="bpm-m5">−5</button>
      <button class="adj-btn" id="bpm-m1">−1</button>
      <button class="adj-btn" id="bpm-p1">+1</button>
      <button class="adj-btn" id="bpm-p5">+5</button>
    </div>
    <div class="sub">כוון עד שהקליק מרגיש נכון</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
      <span style="font-size:16px">🔔</span>
      <input type="range" id="click-vol" min="0" max="100" value="70" style="flex:1;max-width:200px;accent-color:var(--teal)">
    </div>
  </div>
  <div class="bottom-bar" style="padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))"><button class="btn btn-primary" id="bpm-confirm">✓ אשר BPM</button></div>
</div>

<!-- ══ HOME = SESSION ONLY ══ -->
<div id="screen-home" class="screen">
  <div class="topbar">
    <span class="logo" id="home-logo">laylo</span>
    <span class="bpm-chip" id="bpm-chip">♩ —</span>
  </div>
  <div class="session-top-meta">
    <span class="session-proj-name" id="session-proj-name">main</span>
    <span class="session-time" id="session-time-display">0:00</span>
  </div>
  <div class="session-tracks" id="session-tracks"></div>
  <div class="add-track-wrap">
    <button class="add-track-btn" id="btn-add-track">+ ערוץ חדש</button>
  </div>
  <div class="session-controls">
    <button class="sess-play-btn" id="sess-play-btn">▶</button>
    <span class="sess-hint" id="sess-hint">נגן הכל · M/S לסולו</span>
  </div>
  <div class="ai-response" id="ai-response"></div>
  <div class="ai-bar">
    <button class="ai-mic-btn" id="ai-mic-btn">🎤</button>
    <input class="ai-input" id="ai-input" type="text" placeholder="פקודה לAI...">
    <button class="ai-send-btn" id="ai-send">↑</button>
  </div>
</div>

<!-- ══ REVIEW (טראק ראשון) ══ -->
<div id="screen-review" class="screen" style="align-items:center;text-align:center">
  <div class="topbar" style="width:100%;justify-content:center"><span></span></div>
  <div class="center-screen">
    <div style="font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">הקלטה הושלמה</div>
    <div id="review-name" style="font-size:24px;font-weight:900;margin-bottom:28px"></div>
    <button id="review-play-btn" style="width:72px;height:72px;border-radius:50%;background:var(--s2);border:2px solid var(--border);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center">▶</button>
    <div id="review-duration" style="font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--muted)">0:00</div>
  </div>
  <div class="bottom-bar" style="padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))"><div class="gap">
    <button class="btn btn-primary" id="btn-keep">✓ שמור</button>
    <button class="btn btn-ghost" id="btn-redo">↺ הקלט שוב</button>
  </div></div>
</div>

<!-- ══ REVIEW OVERDUB (טראק 2+) ══ -->
<div id="screen-od-review" class="screen" style="align-items:center;text-align:center">
  <div class="topbar" style="width:100%;justify-content:center"><span></span></div>
  <div class="center-screen">
    <div style="font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">overdub הושלם</div>
    <div id="od-review-section" style="font-size:20px;font-weight:900"></div>
    <div class="od-review-layers" id="od-review-layers"></div>
    <div id="od-review-offset" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)"></div>
    <button id="od-review-play-btn" style="width:72px;height:72px;border-radius:50%;background:var(--s2);border:2px solid var(--border);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center">▶</button>
  </div>
  <div class="bottom-bar" style="padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))"><div class="gap">
    <button class="btn btn-primary" id="od-btn-keep">✓ שמור ויישר</button>
    <button class="btn btn-ghost" id="od-btn-redo">↺ הקלט שוב</button>
  </div></div>
</div>

<!-- ══ MODALS ══ -->
<div class="modal-overlay" id="track-modal">
  <div class="modal-sheet">
    <div class="modal-title">ערוץ חדש</div>
    <input class="modal-input" id="track-input" type="text" placeholder="guitar, vocals, bass...">
    <button class="btn btn-primary" id="track-confirm" style="margin-top:12px">המשך →</button>
  </div>
</div>
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-sheet">
    <div class="modal-title" id="confirm-title">למחוק?</div>
    <div class="modal-sub" id="confirm-sub"></div>
    <div class="modal-row">
      <button class="btn btn-ghost" id="confirm-cancel">ביטול</button>
      <button class="btn btn-danger" id="confirm-ok">מחק</button>
    </div>
  </div>
</div>

<script>
// Sprint 5.4 — live M/S gain, AEC only when monitoring, tiled backing loop (no loop-point gap)

async function callAI(prompt, sessionState) {
  try {
    const res = await fetch('/api/ai', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ prompt, sessionState })
    });
    if (!res.ok) throw new Error('proxy error');
    return res.json();
  } catch(e) {
    console.log('[callAI mock fallback]', prompt);
    return { action: 'none', message: `"${prompt}" — AI proxy לא מחובר עדיין` };
  }
}

const DB_NAME='laylo-v2', DB_VER=5;
const MAIN_ID='main';
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      for(const n of [...d.objectStoreNames]) d.deleteObjectStore(n);
      d.createObjectStore('sections',{keyPath:'id'});
      d.createObjectStore('layers',{keyPath:'id'});
      d.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess=e=>{db=e.target.result;res(db)};
    req.onerror=()=>rej(req.error);
  });
}
const dbPut=(s,v)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v).onsuccess=()=>res();t.onerror=()=>rej(t.error)});
const dbGet=(s,k)=>new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbGetAll=s=>new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbDelete=(s,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k).onsuccess=()=>res();t.onerror=()=>rej(t.error)});
const saveArrangement=o=>dbPut('meta',{key:'arrangement',order:o});
const loadArrangement=async()=>{const r=await dbGet('meta','arrangement');return r?r.order:[]};

let sections=[], layers=[], arrangement=[];
let projectBPM=null, currentBPM=120;
let pendingName='';
let pendingODBuffer=null, pendingODMime='', pendingODDuration=0, pendingODOffsetMs=0;
let overdubTrackName='';
let soloTrack=null;
let mutedTracks=new Set();
let sessPlaying=false;
let pendingTracks=[];
let auditionSrc=null, auditionTrackName=null;
let recMetroInterval=null;
let monitorAudioEl=null, monitorUrl=null;
let playGains=new Map();

const FREE_TRACK_LIMIT=4;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const getLayer=track=>layers.find(l=>l.sectionId===MAIN_ID&&l.trackName===track);
const getFirstLayer=()=>layers.filter(l=>l.sectionId===MAIN_ID).sort((a,b)=>a.id.localeCompare(b.id))[0];
const getUniqueTracks=()=>{const seen=new Set();return layers.filter(l=>l.sectionId===MAIN_ID).sort((a,b)=>a.id.localeCompare(b.id)).map(l=>l.trackName).filter(n=>n&&!seen.has(n)&&seen.add(n))};
const shouldPlay=t=>soloTrack?t===soloTrack:!mutedTracks.has(t);
const getSessionState=()=>({tracks:getUniqueTracks(),bpm:projectBPM});

let masterCtx=null;
let mediaRecorder=null, recStream=null, recChunks=[], recStartTime=0, recTimerInterval=null;
let activePlaySrcs=[];
let playheadLoop=null, sessionPlayStartCtxTime=0, sessionPlayDuration=0;
const decodedCache=new Map();

function getMasterCtx(){
  if(!masterCtx||masterCtx.state==='closed') masterCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterCtx.resume().catch(()=>{});
  return masterCtx;
}
async function getDecodedBuffer(layerId,buf){
  if(decodedCache.has(layerId)) return decodedCache.get(layerId);
  const ctx=getMasterCtx();const ab=await ctx.decodeAudioData(buf.slice());
  decodedCache.set(layerId,ab);return ab;
}
function stopAllSrcs(){activePlaySrcs.forEach(s=>{try{s.stop()}catch(e){}});activePlaySrcs=[]}

// masterCtx closes before getUserMedia (Android communication-mode fix).
// Backing plays via <audio> element so guideSrc stays null → ALWAYS closes → clean capture.
let guideSrc=null;
async function startRecording(monitoring=false){
  if(masterCtx && masterCtx.state!=='closed' && !guideSrc){
    decodedCache.clear();
    await masterCtx.close();
    masterCtx=null;
    clickGainNode=null;
  }
  // AEC only when a monitor mix is playing — removes the click/backing from the microphone capture.
  // First/clean takes: all false for studio-quality audio.
  const cons={echoCancellation:monitoring,noiseSuppression:false,autoGainControl:false};
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:cons})}
  catch(e){alert('לא ניתן לגשת למיקרופון.');return false}
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
  mediaRecorder=new MediaRecorder(recStream,mime?{mimeType:mime}:{});
  recChunks=[];
  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};
  mediaRecorder.start(100);recStartTime=Date.now();
  return true;
}
const stopRecording=()=>new Promise(res=>{
  mediaRecorder.onstop=async()=>{
    const blob=new Blob(recChunks,{type:mediaRecorder.mimeType});
    const dur=(Date.now()-recStartTime)/1000;
    const buf=await blob.arrayBuffer();
    pendingODBuffer=buf;pendingODMime=mediaRecorder.mimeType;pendingODDuration=dur;
    recStream.getTracks().forEach(t=>t.stop());res();
  };
  mediaRecorder.stop();
});

async function drawSessionTrackWaveform(canvasEl,layer){
  if(!canvasEl||!layer)return;
  canvasEl.width=canvasEl.offsetWidth||300;canvasEl.height=canvasEl.offsetHeight||46;
  const ctx=canvasEl.getContext('2d');
  ctx.fillStyle='#162438';ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
  try{
    const audioBuf=await getDecodedBuffer(layer.id,layer.buffer);
    const pcm=audioBuf.getChannelData(0);const step=Math.ceil(pcm.length/canvasEl.width);
    ctx.strokeStyle='#0d9488';ctx.lineWidth=1.5;const mid=canvasEl.height/2;
    ctx.beginPath();for(let x=0;x<canvasEl.width;x++){let max=0;for(let j=0;j<step;j++){const v=Math.abs(pcm[x*step+j]||0);if(v>max)max=v}const h=max*canvasEl.height*0.9;x===0?ctx.moveTo(x,mid-h/2):ctx.lineTo(x,mid-h/2)}ctx.stroke();
    ctx.beginPath();for(let x=0;x<canvasEl.width;x++){let max=0;for(let j=0;j<step;j++){const v=Math.abs(pcm[x*step+j]||0);if(v>max)max=v}const h=max*canvasEl.height*0.9;x===0?ctx.moveTo(x,mid+h/2):ctx.lineTo(x,mid+h/2)}ctx.stroke();
  }catch(e){}
}

let clickTimeout=null, clickBeat=0, clickNextTime=0, clickRunning=false;
let clickGainNode=null, clickVolume=0.7;

function startClick(bpm,anchorTime){
  clickRunning=false;if(clickTimeout){clearTimeout(clickTimeout);clickTimeout=null}
  const ctx=getMasterCtx();
  if(!clickGainNode||clickGainNode.context!==ctx){
    if(clickGainNode){try{clickGainNode.disconnect()}catch(e){}}
    clickGainNode=ctx.createGain();clickGainNode.connect(ctx.destination);
  }
  clickGainNode.gain.setValueAtTime(clickVolume,ctx.currentTime);
  const iv=60/bpm;clickBeat=0;
  clickNextTime=(typeof anchorTime==='number'&&anchorTime>ctx.currentTime+0.02)?anchorTime:ctx.currentTime+0.1;
  clickRunning=true;
  function sched(){
    if(!clickRunning)return;const c=getMasterCtx();
    while(clickNextTime<c.currentTime+0.3){
      const a=clickBeat%4===0;const o=c.createOscillator(),g=c.createGain();
      o.frequency.value=a?1200:900;g.gain.setValueAtTime(a?.8:.5,clickNextTime);g.gain.exponentialRampToValueAtTime(0.001,clickNextTime+0.04);
      o.connect(g);g.connect(clickGainNode);o.start(clickNextTime);o.stop(clickNextTime+0.05);
      const b=clickBeat%4,t=Math.max(0,(clickNextTime-c.currentTime)*1000);
      setTimeout(()=>{const el=document.getElementById('cb'+b);if(el){el.style.height='32px';setTimeout(()=>{el.style.height='8px'},100)}const sb=document.getElementById('clkbar'+b);if(sb){sb.style.height='30px';sb.style.opacity='1';setTimeout(()=>{sb.style.height='14px';sb.style.opacity='.5'},120)}},t);
      clickNextTime+=iv;clickBeat++;
    }
    clickTimeout=setTimeout(sched,100);
  }
  sched();
}
function stopClick(){clickRunning=false;if(clickTimeout){clearTimeout(clickTimeout);clickTimeout=null}if(clickGainNode)clickGainNode.gain.setValueAtTime(0,getMasterCtx().currentTime)}
function killClick(){
  clickRunning=false;if(clickTimeout){clearTimeout(clickTimeout);clickTimeout=null}
  if(clickGainNode){try{clickGainNode.disconnect()}catch(e){}clickGainNode=null}
}

// ── ALIGNMENT ──────────────────────────
async function alignLayer(guideArrayBuf, newArrayBuf, currentOffsetMs) {
  const ctx=getMasterCtx();
  const [guideBuf,newBuf]=await Promise.all([ctx.decodeAudioData(guideArrayBuf.slice()),ctx.decodeAudioData(newArrayBuf.slice())]);
  const sr=guideBuf.sampleRate;const FRAME=Math.round(0.01*sr);
  function envelope(ab){const s=ab.getChannelData(0);const out=[];for(let i=0;i<s.length;i+=FRAME){let sum=0;for(let j=0;j<FRAME&&i+j<s.length;j++)sum+=s[i+j]**2;out.push(Math.sqrt(sum/FRAME))}return out}
  function normalize(env){const mean=env.reduce((a,b)=>a+b,0)/(env.length||1);const std=Math.sqrt(env.reduce((a,b)=>a+(b-mean)**2,0)/(env.length||1))||1;return env.map(v=>(v-mean)/std)}
  const gEnv=normalize(envelope(guideBuf));const nEnv=normalize(envelope(newBuf));
  const minLag=Math.round(-2000/10);const maxLag=Math.round(500/10);
  const compLen=Math.min(gEnv.length,nEnv.length,Math.round(10*sr/FRAME));
  let bestLag=0,bestScore=-Infinity;
  for(let lag=minLag;lag<=maxLag;lag++){
    let score=0,n=0;for(let i=0;i<compLen;i++){const j=i+lag;if(j>=0&&j<nEnv.length){score+=gEnv[i]*nEnv[j];n++}}
    const norm=n>0?score/n:0;if(norm>bestScore){bestScore=norm;bestLag=lag}
  }
  return{correctedOffsetMs:currentOffsetMs+bestLag*10,shiftMs:bestLag*10,correlation:bestScore};
}

// Render monitor mix (M/S filtered layers + click) as a tiled WAV blob.
// Tiled ~60s: avoids the audible gap at the <audio loop> point on Android.
async function renderBackingLoop(){
  const monitor=layers.filter(l=>l.sectionId===MAIN_ID && shouldPlay(l.trackName));
  const playClick=projectBPM && shouldPlay('click');
  if(!monitor.length && !playClick) return null;
  let decoded=[];
  if(monitor.length){
    const tmp=new (window.AudioContext||window.webkitAudioContext)();
    decoded=await Promise.all(monitor.map(async l=>({l,buf:await tmp.decodeAudioData(l.buffer.slice())})));
    await tmp.close();
  }
  const beat=projectBPM?60/projectBPM:0.5;
  let loopLen=0;decoded.forEach(({l,buf})=>loopLen=Math.max(loopLen,(l.offsetMs||0)/1000+buf.duration));
  if(projectBPM){const bar=beat*4;loopLen=Math.max(loopLen,bar);loopLen=Math.ceil(loopLen/bar)*bar;}
  else if(!loopLen) loopLen=2;
  const reps=Math.max(1,Math.ceil(60/loopLen));
  const totalLen=loopLen*reps;
  const sr=22050;
  const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(totalLen*sr)),sr);
  for(let r=0;r<reps;r++){
    const base=r*loopLen;
    decoded.forEach(({l,buf})=>{const s=off.createBufferSource();s.buffer=buf;const g=off.createGain();g.gain.value=(l.volume??1)*0.9;s.connect(g);g.connect(off.destination);s.start(base+(l.offsetMs||0)/1000,(l.clipOffset||0)/1000)});
  }
  if(playClick){for(let n=0,t=0;t<totalLen-0.0005;n++,t=n*beat){const a=n%4===0;const o=off.createOscillator(),g=off.createGain();o.frequency.value=a?1200:900;g.gain.setValueAtTime((a?.8:.5)*clickVolume,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);o.connect(g);g.connect(off.destination);o.start(t);o.stop(t+0.05)}}
  const rendered=await off.startRendering();
  return {blob:audioBufferToWavBlob(rendered), loopLen};
}
function audioBufferToWavBlob(ab){
  const nCh=ab.numberOfChannels,sr=ab.sampleRate,len=ab.length,bps=2,blockAlign=nCh*bps,dataLen=len*blockAlign;
  const view=new DataView(new ArrayBuffer(44+dataLen));let p=0;
  const ws=s=>{for(let i=0;i<s.length;i++)view.setUint8(p++,s.charCodeAt(i))},w32=v=>{view.setUint32(p,v,true);p+=4},w16=v=>{view.setUint16(p,v,true);p+=2};
  ws('RIFF');w32(36+dataLen);ws('WAVE');ws('fmt ');w32(16);w16(1);w16(nCh);w32(sr);w32(sr*blockAlign);w16(blockAlign);w16(16);ws('data');w32(dataLen);
  const chans=[];for(let c=0;c<nCh;c++)chans.push(ab.getChannelData(c));
  for(let i=0;i<len;i++)for(let c=0;c<nCh;c++){let s=Math.max(-1,Math.min(1,chans[c][i]));view.setInt16(p,s<0?s*0x8000:s*0x7FFF,true);p+=2}
  return new Blob([view.buffer],{type:'audio/wav'});
}

async function startInlineRecord(trackName){
  stopAudition();if(sessPlaying)stopSession();
  recIsFirst=!getFirstLayer();
  overdubTrackName=trackName;pendingName=trackName;
  guideSrc=null;backingSrcs=[];
  const playClick=projectBPM && shouldPlay('click');
  let backing=null;
  try{backing=await renderBackingLoop();}catch(e){console.log('[backing render failed]',e);}
  let playStartMs=0;
  if(backing&&backing.blob){
    if(monitorUrl){URL.revokeObjectURL(monitorUrl);monitorUrl=null}
    monitorUrl=URL.createObjectURL(backing.blob);
    if(!monitorAudioEl)monitorAudioEl=new Audio();
    monitorAudioEl.loop=true;monitorAudioEl.src=monitorUrl;
    try{monitorAudioEl.currentTime=0;await monitorAudioEl.play();}catch(e){}
    playStartMs=Date.now();
  }
  const monitoring=!!(backing&&backing.blob);
  const ok=await startRecording(monitoring);
  if(!ok){stopBacking();return}
  pendingODOffsetMs=(recIsFirst||!monitoring)?0:Math.max(0,recStartTime-playStartMs);
  recordingTrack=trackName;
  renderSession();
  if(playClick) startRecMetronomeVisual(projectBPM);
  recTimerInterval=setInterval(()=>{const el=document.getElementById('rec-row-timer');if(el)el.textContent=fmtTime((Date.now()-recStartTime)/1000)},250);
}

  const nt=document.createElement('div');nt.className='od-layer-tag';nt.style.background='rgba(13,148,136,.2)';nt.textContent=overdubTrackName+' ✦';tagsEl.appendChild(nt);
  document.getElementById('od-review-play-btn').textContent='▶';document.getElementById('od-review-play-btn').style.background='var(--s2)';
  showScreen('screen-od-review');
}
let odReviewPlaying=false;
document.getElementById('od-review-play-btn').addEventListener('click',async()=>{
  const btn=document.getElementById('od-review-play-btn');
  if(odReviewPlaying){stopAllSrcs();odReviewPlaying=false;btn.textContent='▶';btn.style.background='var(--s2)';return}
  const secLayers=layers.filter(l=>l.sectionId===MAIN_ID);
  const decoded=await Promise.all(secLayers.map(l=>getDecodedBuffer(l.id,l.buffer)));
  const odBuf=await getMasterCtx().decodeAudioData(pendingODBuffer.slice());
  const ctx=getMasterCtx();const now=ctx.currentTime+0.1;
  odReviewPlaying=true;btn.textContent='■';btn.style.background='var(--teal)';
  const srcs=decoded.map((b,idx)=>{const l=secLayers[idx];const s=ctx.createBufferSource();s.buffer=b;const g=ctx.createGain();g.gain.value=l.volume??1;const p=ctx.createStereoPanner();p.pan.value=l.pan??0;s.connect(p);p.connect(g);g.connect(ctx.destination);s.start(now+(l.offsetMs||0)/1000,(l.clipOffset||0)/1000,l.clipDuration?l.clipDuration/1000:undefined);return s});
  const odSrc=ctx.createBufferSource();odSrc.buffer=odBuf;odSrc.connect(ctx.destination);odSrc.start(now+pendingODOffsetMs/1000);
  activePlaySrcs=[...srcs,odSrc];
  odSrc.onended=()=>{odReviewPlaying=false;btn.textContent='▶';btn.style.background='var(--s2)';activePlaySrcs=[]};
});
document.getElementById('od-btn-keep').addEventListener('click',async()=>{
  stopAllSrcs();showAIResponse('מיישר...');
  let finalOffsetMs=pendingODOffsetMs;
  const firstLayer=getFirstLayer();
  if(firstLayer){
    try{
      const {correctedOffsetMs,shiftMs,correlation}=await alignLayer(firstLayer.buffer,pendingODBuffer,pendingODOffsetMs);
      if(correlation>=0.3){finalOffsetMs=correctedOffsetMs;showAIResponse(`יושר ${Math.abs(Math.round(shiftMs))}ms ${shiftMs>=0?'מאוחר':'מוקדם'} (${correlation.toFixed(2)})`)}
      else{showAIResponse(`correlation נמוך (${correlation.toFixed(2)}) — שמור ללא יישור`)}
    }catch(e){showAIResponse('שמור ללא יישור (שגיאה)')}
  }else{showAIResponse('')}
  const layerId=uid();
  const layer={id:layerId,sectionId:MAIN_ID,trackName:overdubTrackName,buffer:pendingODBuffer,mimeType:pendingODMime,offsetMs:finalOffsetMs,volume:1.0,pan:0.0,clipOffset:0,clipDuration:null};
  layers.push(layer);
  const sec=sections.find(s=>s.id===MAIN_ID);if(sec){sec.duration=Math.max(sec.duration||0,pendingODDuration+finalOffsetMs/1000);await dbPut('sections',sec)}
  decodedCache.delete(layerId);await dbPut('layers',layer);
  pendingTracks=pendingTracks.filter(t=>t!==overdubTrackName);
  renderSession();showScreen('screen-home');
});
document.getElementById('od-btn-redo').addEventListener('click',()=>{stopAllSrcs();startInlineRecord(overdubTrackName);showScreen('screen-home')});

// ── SESSION PLAYBACK — live M/S ──
function stopSession(){stopAllSrcs();stopClick();stopPlayheadLoop();playGains.clear();sessPlaying=false;document.getElementById('sess-play-btn').textContent='▶'}
function applyLiveMix(){
  playGains.forEach((g,name)=>{const l=getLayer(name);try{g.gain.value=shouldPlay(name)?(l?(l.volume??1):1):0}catch(e){}});
  if(clickGainNode&&clickRunning){try{clickGainNode.gain.value=(projectBPM&&shouldPlay('click'))?clickVolume:0}catch(e){}}
}
document.getElementById('sess-play-btn').addEventListener('click',async()=>{
  if(recordingTrack)return;
  const btn=document.getElementById('sess-play-btn');
  if(sessPlaying){stopSession();return}
  stopAudition();
  const allLayers=layers.filter(l=>l.sectionId===MAIN_ID);
  if(!allLayers.length&&!projectBPM)return;
  const ctx=getMasterCtx();const now=ctx.currentTime+0.12;
  let maxDur=0.001;activePlaySrcs=[];playGains=new Map();
  if(allLayers.length){
    const decoded=await Promise.all(allLayers.map(l=>getDecodedBuffer(l.id,l.buffer)));
    maxDur=Math.max(...decoded.map((b,i)=>b.duration+(allLayers[i].offsetMs||0)/1000),0.001);
    // start ALL layers; muted ones at gain=0 so un-muting mid-play is instant and in sync
    decoded.forEach((b,i)=>{const l=allLayers[i];const s=ctx.createBufferSource();s.buffer=b;const g=ctx.createGain();g.gain.value=shouldPlay(l.trackName)?(l.volume??1):0;const p=ctx.createStereoPanner();p.pan.value=l.pan??0;s.connect(p);p.connect(g);g.connect(ctx.destination);s.start(now+(l.offsetMs||0)/1000,(l.clipOffset||0)/1000,l.clipDuration?l.clipDuration/1000:undefined);activePlaySrcs.push(s);playGains.set(l.trackName,g)});
  }
  sessPlaying=true;btn.textContent='■';
  if(projectBPM){startClick(projectBPM,now);if(clickGainNode)clickGainNode.gain.value=shouldPlay('click')?clickVolume:0}
  if(allLayers.length){
    startPlayheadLoop(maxDur);
    setTimeout(()=>{if(sessPlaying)stopSession()},maxDur*1000+350);
  }
});

// ── ADD TRACK ──
const closeTrackModal=()=>document.getElementById('track-modal').classList.remove('open');
document.getElementById('btn-add-track').addEventListener('click',()=>{
  const count=getUniqueTracks().length+pendingTracks.length;
  if(count>=FREE_TRACK_LIMIT){showAIResponse(`${FREE_TRACK_LIMIT} ערוצים = שיר שלם 🎸 Laylo Pro לעוד`);return}
  const i=document.getElementById('track-input');i.value='';
  document.getElementById('track-modal').classList.add('open');setTimeout(()=>i.focus(),300);
});
document.getElementById('track-confirm').addEventListener('click',()=>{
  const v=document.getElementById('track-input').value.trim();if(!v)return;
  const existing=getUniqueTracks();
  if(existing.includes(v)||pendingTracks.includes(v)){showAIResponse('כבר יש ערוץ בשם הזה');return}
  if(existing.length+pendingTracks.length>=FREE_TRACK_LIMIT){showAIResponse(`${FREE_TRACK_LIMIT} ערוצים = שיר שלם 🎸 Laylo Pro לעוד`);closeTrackModal();return}
  closeTrackModal();
  pendingTracks.push(v);renderSession();
  showAIResponse(`"${v}" נוסף — לחץ ● בשורה כדי להקליט`);
});
document.getElementById('track-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('track-confirm').click()});
document.getElementById('track-modal').addEventListener('click',e=>{if(e.target===document.getElementById('track-modal'))closeTrackModal()});

// ── DELETE TRACK ──
let pendingDeleteTrack=null;
function askDeleteTrack(trackName){
  if(recordingTrack)return;
  pendingDeleteTrack=trackName;
  document.getElementById('confirm-title').textContent='למחוק ערוץ?';
  document.getElementById('confirm-sub').textContent=`"${trackName}" יימחק לצמיתות. אי אפשר לבטל.`;
  document.getElementById('confirm-modal').classList.add('open');
}
const closeConfirm=()=>{document.getElementById('confirm-modal').classList.remove('open');pendingDeleteTrack=null};
document.getElementById('confirm-cancel').addEventListener('click',closeConfirm);
document.getElementById('confirm-modal').addEventListener('click',e=>{if(e.target===document.getElementById('confirm-modal'))closeConfirm()});
document.getElementById('confirm-ok').addEventListener('click',async()=>{
  const trackName=pendingDeleteTrack;if(!trackName){closeConfirm();return}
  if(auditionTrackName===trackName)stopAudition();
  const layer=getLayer(trackName);
  if(layer){decodedCache.delete(layer.id);await dbDelete('layers',layer.id);layers=layers.filter(l=>l.id!==layer.id)}
  pendingTracks=pendingTracks.filter(t=>t!==trackName);
  if(soloTrack===trackName)soloTrack=null;mutedTracks.delete(trackName);
  closeConfirm();renderSession();showAIResponse(`"${trackName}" נמחק`);
});

// ── AI BAR + VOICE ──
async function sendAICommand(cmd){
  if(!cmd)return;document.getElementById('ai-input').value='';showAIResponse('...');
  const result=await callAI(cmd,getSessionState());showAIResponse(result.message||'');
}
document.getElementById('ai-send').addEventListener('click',()=>sendAICommand(document.getElementById('ai-input').value.trim()));
document.getElementById('ai-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendAICommand(document.getElementById('ai-input').value.trim())});
let recognition=null;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='he-IL';recognition.interimResults=false;
  recognition.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('ai-input').value=t;sendAICommand(t)};
  recognition.onend=()=>document.getElementById('ai-mic-btn').classList.remove('listening');
  recognition.onerror=()=>document.getElementById('ai-mic-btn').classList.remove('listening');
}
document.getElementById('ai-mic-btn').addEventListener('click',()=>{
  if(!recognition){showAIResponse('זיהוי קולי לא נתמך');return}
  document.getElementById('ai-mic-btn').classList.add('listening');recognition.start();
});

// ── INIT ──
async function init(){
  if(!sessionStorage.getItem('laylo-session')){
    await new Promise(r=>{const req=indexedDB.deleteDatabase('laylo-v2');req.onsuccess=req.onerror=r});
    sessionStorage.setItem('laylo-session','1');
  }
  await openDB();
  const project=await dbGet('meta','project');
  sections=await dbGetAll('sections');layers=await dbGetAll('layers');
  const savedArr=await loadArrangement();const ids=new Set(sections.map(s=>s.id));
  arrangement=savedArr.filter(id=>ids.has(id));sections.forEach(s=>{if(!arrangement.includes(s.id))arrangement.push(s.id)});
  if(project?.bpm){
    projectBPM=project.bpm;document.getElementById('bpm-chip').textContent=`♩ ${projectBPM}`;
    await ensureMainSection();renderSession();showScreen('screen-home');
  } else showScreen('screen-bpm-welcome');
}
init().catch(console.error);

;(()=>{
  let t=null;const logo=document.getElementById('home-logo');if(!logo)return;
  logo.addEventListener('touchstart',e=>{e.preventDefault();t=setTimeout(()=>{indexedDB.deleteDatabase('laylo-v2');location.reload()},3000)},{passive:false});
  logo.addEventListener('touchend',()=>clearTimeout(t));logo.addEventListener('touchcancel',()=>clearTimeout(t));
})();
</script>
