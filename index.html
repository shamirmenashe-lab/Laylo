<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110d">
<title>Laylo Deck</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110d;--panel:#1f1a14;--panel2:#28211a;--line:#33291c;--text:#ede4d3;--muted:#8a7a63;--amber:#f5a623;--amber-dim:#7a5413;--rec:#e5484d;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;direction:rtl}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);opacity:0;pointer-events:none;transition:opacity .18s}
.screen.active{opacity:1;pointer-events:all}
.mono{font-family:'IBM Plex Mono',monospace}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.logo{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700;color:var(--amber);letter-spacing:-.04em}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:20px}
.chips{display:flex;gap:8px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);border:1px solid var(--amber-dim);padding:4px 10px;border-radius:20px}
.chip.dim{color:var(--muted);border-color:var(--line)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 28px}
.h1{font-size:25px;font-weight:900;line-height:1.25}
.sub{font-size:14px;color:var(--muted);line-height:1.7}
.bigbtn{width:100%;background:var(--amber);color:#1a1206;font-weight:900;font-size:16px;padding:16px;border-radius:var(--r)}
.bigbtn:active{opacity:.8}
.ghostbtn{width:100%;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;padding:14px;border-radius:var(--r);color:var(--text)}
.bottom{padding:12px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.bpm-num{font-family:'IBM Plex Mono',monospace;font-size:76px;font-weight:700;color:var(--amber);letter-spacing:-.05em}
.adjrow{display:flex;gap:8px}
.adj{height:50px;padding:0 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--text)}
.adj:active{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.pulse-dot{width:14px;height:14px;border-radius:50%;background:var(--amber);opacity:.25;transition:opacity .06s,transform .06s}
.pulse-dot.on{opacity:1;transform:scale(1.5)}
.calib-meter{font-family:'IBM Plex Mono',monospace;font-size:42px;font-weight:700;color:var(--amber)}
.counter-strip{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:4px 0 8px}
.counter{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:700;color:var(--amber);letter-spacing:.02em}
.counter.rec{color:var(--rec)}
.transport{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 18px 12px}
.tp-btn{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:23px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .08s}
.tp-btn:active{transform:scale(.93)}
.tp-rec{color:var(--rec);border-color:#5a2326}
.tp-rec.live{background:var(--rec);color:#fff;border-color:var(--rec);animation:blink 1s infinite}
.tp-rec:disabled{opacity:.3}
.tp-play.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
.tp-side{width:46px;height:46px;font-size:17px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tp-side.on{color:var(--amber);border-color:var(--amber-dim)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.hintline{text-align:center;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;min-height:18px;padding:0 18px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks{flex:1;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.strip-main{display:flex;align-items:center;gap:10px}
.strip.armed{border-color:var(--rec);box-shadow:0 0 0 1px var(--rec),0 0 18px rgba(229,72,77,.18)}
.strip.recording{background:#241313}
.numeral{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;width:48px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);background:var(--panel2);flex-shrink:0;transition:color .12s,background .12s}
.strip.has-audio .numeral{color:var(--amber)}
.strip.armed .numeral{color:#fff;background:var(--rec)}
.ms{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.msb{width:26px;height:25px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--muted)}
.msb.m-on{background:#3d1518;color:var(--rec);border-color:var(--rec)}
.msb.s-on{background:#3d3010;color:var(--amber);border-color:var(--amber)}
.wavewrap{flex:1;height:54px;background:#0e0b08;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
.wave{width:100%;height:100%;display:block}
.phead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--amber);pointer-events:none}
.empty-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4a3f30;letter-spacing:.25em}
.nudge-btn{width:26px;height:54px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:13px;flex-shrink:0}
.nudge-btn.open{color:var(--amber);border-color:var(--amber-dim)}
.drawer{display:none;align-items:center;gap:8px;justify-content:center;padding-top:2px}
.drawer.open{display:flex}
.dr-btn{height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--text)}
.dr-btn:active{background:var(--amber);color:#1a1206}
.dr-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amber);min-width:72px;text-align:center}
.ai-out{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);padding:4px 18px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-bar{display:flex;gap:8px;align-items:center;padding:8px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.ai-in{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px;color:var(--text);font-family:'Heebo',sans-serif;direction:rtl;outline:none}
.ai-in:focus{border-color:var(--amber-dim)}
.ai-round{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ai-send{background:var(--amber);color:#1a1206}
.ai-mic{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.ai-mic.listening{background:var(--rec);color:#fff;animation:blink .5s infinite}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--panel);border-radius:18px 18px 0 0;padding:22px 20px;width:100%;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.sheet .h1{font-size:18px;margin-bottom:6px}
.row2{display:flex;gap:10px;margin-top:14px}
.row2 .ghostbtn,.row2 .dangerbtn{flex:1}
.dangerbtn{background:#3d1518;border:1px solid var(--rec);color:var(--rec);font-weight:700;font-size:15px;padding:14px;border-radius:var(--r)}
</style>
</head>
<body>

<!-- ══ BPM ══ -->
<div id="scr-bpm" class="screen">
  <div class="topbar"><span class="logo">laylo deck</span><span class="badge">sprint 6</span></div>
  <div class="center">
    <div style="display:flex;gap:10px"><div class="pulse-dot" id="pd0"></div><div class="pulse-dot" id="pd1"></div><div class="pulse-dot" id="pd2"></div><div class="pulse-dot" id="pd3"></div></div>
    <div class="bpm-num" id="bpm-num">120</div>
    <div class="adjrow">
      <button class="adj" id="b-m5">−5</button><button class="adj" id="b-m1">−1</button>
      <button class="adj" id="b-p1">+1</button><button class="adj" id="b-p5">+5</button>
    </div>
    <div class="sub">כוון עד שהקליק יושב לך נכון</div>
  </div>
  <div class="bottom"><button class="bigbtn" id="b-ok">✓ אשר קצב</button></div>
</div>

<!-- ══ CALIBRATION ══ -->
<div id="scr-calib" class="screen">
  <div class="topbar"><span class="logo">laylo deck</span><span class="badge mono">כיול</span></div>
  <div class="center" id="calib-body">
    <div class="h1">כיול השהיה</div>
    <div class="sub">המכשיר ישמיע 3 ביפים ויקליט אותם בעצמו,<br>כדי למדוד את ההשהיה האמיתית שלו.<br><br><b>הסר אוזניות · הגבר ווליום · שקט בחדר</b></div>
    <div class="calib-meter" id="calib-meter">—</div>
  </div>
  <div class="bottom">
    <button class="bigbtn" id="calib-run">▶ התחל כיול</button>
    <button class="ghostbtn" id="calib-skip">דלג (ברירת מחדל 120ms)</button>
  </div>
</div>

<!-- ══ DECK ══ -->
<div id="scr-deck" class="screen">
  <div class="topbar">
    <span class="logo" id="logo">laylo deck</span>
    <div class="chips">
      <button class="chip dim" id="chip-cal">cal —</button>
      <button class="chip" id="chip-bpm">♩ —</button>
    </div>
  </div>
  <div class="counter-strip">
    <span class="counter" id="counter">00:00.0</span>
  </div>
  <div class="transport">
    <button class="tp-side" id="tp-click">♩</button>
    <button class="tp-btn tp-rec" id="tp-rec" disabled>●</button>
    <button class="tp-btn tp-play" id="tp-play">▶</button>
  </div>
  <div class="hintline" id="hint">בחר ערוץ (1–4) כדי להקליט</div>
  <div class="tracks" id="tracks"></div>
  <div class="ai-out" id="ai-out"></div>
  <div class="ai-bar">
    <button class="ai-round ai-mic" id="ai-mic">🎤</button>
    <input class="ai-in" id="ai-in" type="text" placeholder="פקודה לטכנאי...">
    <button class="ai-round ai-send" id="ai-send">↑</button>
  </div>
</div>

<!-- ══ CONFIRM ══ -->
<div class="overlay" id="ovl">
  <div class="sheet">
    <div class="h1" id="ovl-title">לנקות ערוץ?</div>
    <div class="sub" id="ovl-sub"></div>
    <div class="row2">
      <button class="ghostbtn" id="ovl-no">ביטול</button>
      <button class="dangerbtn" id="ovl-yes">נקה</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   LAYLO DECK — sprint 6
   Model: fixed 4-track tape deck. Arm a numeral → ⏺ records onto that
   track (replacing it). No review screens. One-time round-trip latency
   calibration compensates every take (BandLab approach); per-track
   manual nudge as safety net. Click is a transport toggle, not a track.
   AI technician: does everything except play — local Hebrew commands,
   remote AI as fallback.
   Engine truths (proven the hard way):
   · mic FIRST, then close masterCtx, then start backing  (routing fix)
   · backing = pre-rendered tiled WAV via <audio>, never live WebAudio
   · notch 900/1200Hz cleanup on monitored takes (click bleed removal)
   ════════════════════════════════════════════════════════════════════ */

const TRACKS=['t1','t2','t3','t4'];
const TRACK_LABEL={t1:'1',t2:'2',t3:'3',t4:'4'};
const DB_NAME='laylo-v2', DB_VER=5, MAIN_ID='main';
const DEFAULT_LATENCY=120;

let db;
function openDB(){return new Promise((res,rej)=>{
  const q=indexedDB.open(DB_NAME,DB_VER);
  q.onupgradeneeded=e=>{const d=e.target.result;for(const n of [...d.objectStoreNames])d.deleteObjectStore(n);
    d.createObjectStore('sections',{keyPath:'id'});d.createObjectStore('layers',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'});};
  q.onsuccess=e=>{db=e.target.result;res()};q.onerror=()=>rej(q.error);
})}
const dbPut=(s,v)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v).onsuccess=()=>res();t.onerror=()=>rej(t.error)});
const dbGet=(s,k)=>new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbGetAll=s=>new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbDel=(s,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k).onsuccess=()=>res();t.onerror=()=>rej(t.error)});

let layers=[];
let projectBPM=null, curBPM=120;
let latencyMs=DEFAULT_LATENCY;
let clickOn=true;
let armedTrack=null;
let mutedTracks=new Set(), soloTrack=null;
let openDrawer=null;
let isRecording=false, isPlaying=false;

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtC=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`;
const getLayer=t=>layers.find(l=>l.trackName===t);
const shouldPlay=t=>soloTrack?t===soloTrack:!mutedTracks.has(t);
const hint=m=>{document.getElementById('hint').textContent=m||''};
const aiSay=m=>{document.getElementById('ai-out').textContent=m||''};

let masterCtx=null;const decodedCache=new Map();
function ctx(){if(!masterCtx||masterCtx.state==='closed')masterCtx=new (window.AudioContext||window.webkitAudioContext)();masterCtx.resume().catch(()=>{});return masterCtx}
async function dec(l){if(decodedCache.has(l.id))return decodedCache.get(l.id);const b=await ctx().decodeAudioData(l.buffer.slice());decodedCache.set(l.id,b);return b}
let playSrcs=[],playGains=new Map();
function stopSrcs(){playSrcs.forEach(s=>{try{s.stop()}catch(e){}});playSrcs=[]}

let clkTimer=null,clkBeat=0,clkNext=0,clkRun=false,clkGain=null;const CLICK_VOL=0.7;
function startClick(bpm,anchor,startBeat=0){
  clkRun=false;if(clkTimer){clearTimeout(clkTimer);clkTimer=null}
  const c=ctx();
  if(!clkGain||clkGain.context!==c){if(clkGain){try{clkGain.disconnect()}catch(e){}}clkGain=c.createGain();clkGain.connect(c.destination)}
  clkGain.gain.setValueAtTime(CLICK_VOL,c.currentTime);
  const iv=60/bpm;clkBeat=startBeat;
  clkNext=(typeof anchor==='number'&&anchor>c.currentTime+0.02)?anchor:c.currentTime+0.08;
  clkRun=true;
  (function sched(){
    if(!clkRun)return;const cc=ctx();
    while(clkNext<cc.currentTime+0.3){
      const a=clkBeat%4===0,o=cc.createOscillator(),g=cc.createGain();
      o.frequency.value=a?1200:900;g.gain.setValueAtTime(a?.8:.5,clkNext);g.gain.exponentialRampToValueAtTime(.001,clkNext+.04);
      o.connect(g);g.connect(clkGain);o.start(clkNext);o.stop(clkNext+.05);
      clkNext+=iv;clkBeat++;
    }
    clkTimer=setTimeout(sched,100);
  })();
}
function stopClick(){clkRun=false;if(clkTimer){clearTimeout(clkTimer);clkTimer=null}if(clkGain){try{clkGain.gain.setValueAtTime(0,ctx().currentTime)}catch(e){}}}
function killClick(){clkRun=false;if(clkTimer){clearTimeout(clkTimer);clkTimer=null}if(clkGain){try{clkGain.disconnect()}catch(e){}clkGain=null}}

function toWav(ab){
  const n=ab.numberOfChannels,sr=ab.sampleRate,len=ab.length,ba=n*2,dl=len*ba;
  const v=new DataView(new ArrayBuffer(44+dl));let p=0;
  const ws=s=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))},w32=x=>{v.setUint32(p,x,true);p+=4},w16=x=>{v.setUint16(p,x,true);p+=2};
  ws('RIFF');w32(36+dl);ws('WAVE');ws('fmt ');w32(16);w16(1);w16(n);w32(sr);w32(sr*ba);w16(ba);w16(16);ws('data');w32(dl);
  const ch=[];for(let c=0;c<n;c++)ch.push(ab.getChannelData(c));
  for(let i=0;i<len;i++)for(let c=0;c<n;c++){let s=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(p,s<0?s*0x8000:s*0x7FFF,true);p+=2}
  return new Blob([v.buffer],{type:'audio/wav'});
}

async function cleanBleed(buf){
  const t=new (window.AudioContext||window.webkitAudioContext)();
  const src=await t.decodeAudioData(buf.slice());await t.close();
  const off=new OfflineAudioContext(src.numberOfChannels,src.length,src.sampleRate);
  const s=off.createBufferSource();s.buffer=src;let node=s;
  for(const f of [900,900,1200,1200]){const nf=off.createBiquadFilter();nf.type='notch';nf.frequency.value=f;nf.Q.value=18;node.connect(nf);node=nf}
  node.connect(off.destination);s.start(0);
  const out=await off.startRendering();
  return {buffer:await toWav(out).arrayBuffer(),mime:'audio/wav'};
}

let monEl=null,monUrl=null;
async function renderBacking(exceptTrack){
  const mon=layers.filter(l=>l.trackName!==exceptTrack&&shouldPlay(l.trackName));
  if(!mon.length&&!clickOn)return null;
  let decd=[];
  if(mon.length){
    const t=new (window.AudioContext||window.webkitAudioContext)();
    decd=await Promise.all(mon.map(async l=>({l,b:await t.decodeAudioData(l.buffer.slice())})));
    await t.close();
  }
  const beat=60/(projectBPM||120),bar=beat*4;
  let loop=0;decd.forEach(({l,b})=>loop=Math.max(loop,(l.offsetMs||0)/1000+b.duration));
  loop=Math.max(loop,bar);loop=Math.ceil(loop/bar)*bar;
  const reps=Math.max(1,Math.ceil(60/loop)),total=loop*reps,sr=22050;
  const off=new OfflineAudioContext(1,Math.ceil(total*sr),sr);
  for(let r=0;r<reps;r++){
    const base=r*loop;
    decd.forEach(({l,b})=>{const s=off.createBufferSource();s.buffer=b;const g=off.createGain();g.gain.value=(l.volume??1)*0.9;s.connect(g);g.connect(off.destination);s.start(base+(l.offsetMs||0)/1000)});
  }
  if(clickOn){for(let n=0,t=0;t<total-5e-4;n++,t=n*beat){const a=n%4===0,o=off.createOscillator(),g=off.createGain();o.frequency.value=a?1200:900;g.gain.setValueAtTime((a?.8:.5)*CLICK_VOL,t);g.gain.exponentialRampToValueAtTime(1e-4,t+.04);o.connect(g);g.connect(off.destination);o.start(t);o.stop(t+.05)}}
  return toWav(await off.startRendering());
}

let recStream=null,mediaRec=null,recChunks=[],recStartMs=0;
async function micOpen(){
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});return true}
  catch(e){aiSay('אין גישה למיקרופון');return false}
}
function recBegin(){
  const m=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'');
  mediaRec=new MediaRecorder(recStream,m?{mimeType:m}:{});recChunks=[];
  mediaRec.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};
  mediaRec.start(100);recStartMs=Date.now();
}
const recEnd=()=>new Promise(res=>{
  mediaRec.onstop=async()=>{
    const blob=new Blob(recChunks,{type:mediaRec.mimeType});
    recStream.getTracks().forEach(t=>t.stop());
    res({buffer:await blob.arrayBuffer(),mime:mediaRec.mimeType,dur:(Date.now()-recStartMs)/1000});
  };
  mediaRec.stop();
});

let recMonitored=false,recPlayStartMs=0,recTickInt=null;
async function startTake(){
  if(!armedTrack||isRecording)return;
  await stopPlayback();killClick();
  const track=armedTrack;
  if(!await micOpen())return;
  if(masterCtx&&masterCtx.state!=='closed'){decodedCache.clear();await masterCtx.close();masterCtx=null;clkGain=null}
  recMonitored=false;recPlayStartMs=0;
  try{
    const wav=await renderBacking(track);
    if(wav){
      if(monUrl){URL.revokeObjectURL(monUrl)}
      monUrl=URL.createObjectURL(wav);
      if(!monEl)monEl=new Audio();
      monEl.loop=true;monEl.src=monUrl;monEl.currentTime=0;
      await monEl.play().catch(()=>{});
      recPlayStartMs=Date.now();recMonitored=true;
    }
  }catch(e){console.log('[backing]',e)}
  recBegin();
  isRecording=true;
  document.getElementById('tp-rec').classList.add('live');
  document.getElementById('tp-rec').textContent='■';
  document.getElementById('counter').classList.add('rec');
  hint(`מקליט → ערוץ ${TRACK_LABEL[track]}`);
  renderDeck();
  recTickInt=setInterval(()=>{document.getElementById('counter').textContent=fmtC((Date.now()-recStartMs)/1000)},100);
}
async function stopTake(){
  if(!isRecording)return;
  clearInterval(recTickInt);
  const track=armedTrack;
  const take=await recEnd();
  if(monEl){try{monEl.pause()}catch(e){}}
  if(monUrl){URL.revokeObjectURL(monUrl);monUrl=null}
  isRecording=false;
  document.getElementById('tp-rec').classList.remove('live');
  document.getElementById('tp-rec').textContent='●';
  document.getElementById('counter').classList.remove('rec');
  let buf=take.buffer,mime=take.mime;
  if(recMonitored){
    hint('מנקה זליגת קליק...');
    try{const c=await cleanBleed(buf);buf=c.buffer;mime=c.mime}catch(e){console.log('[clean]',e)}
  }
  const rawDelta=recMonitored?Math.max(0,recStartMs-recPlayStartMs):0;
  const offsetMs=Math.max(-1500,rawDelta-latencyMs);
  const old=getLayer(track);
  if(old){decodedCache.delete(old.id);await dbDel('layers',old.id);layers=layers.filter(l=>l.id!==old.id)}
  const layer={id:uid(),sectionId:MAIN_ID,trackName:track,buffer:buf,mimeType:mime,offsetMs,volume:1.0,pan:0.0,clipOffset:0,clipDuration:null};
  layers.push(layer);await dbPut('layers',layer);
  armedTrack=null;
  document.getElementById('tp-rec').disabled=true;
  hint(`ערוץ ${TRACK_LABEL[track]} על הטייפ · ▶ להאזנה`);
  document.getElementById('counter').textContent='00:00.0';
  renderDeck();
}

let playFrom=0,playStartCtx=0,playDur=0,playTick=null,playStopTO=null;
async function startPlayback(fromSec=0,isFrac=false){
  await stopPlayback();
  if(!layers.length&&!projectBPM)return;
  const c=ctx();
  let maxDur=.001,decoded=[];
  if(layers.length){
    decoded=await Promise.all(layers.map(l=>dec(l)));
    maxDur=Math.max(...decoded.map((b,i)=>b.duration+(layers[i].offsetMs||0)/1000),.001);
  }
  if(isFrac)fromSec*=maxDur;
  fromSec=Math.max(0,Math.min(fromSec,Math.max(0,maxDur-.05)));
  const now=c.currentTime+.12;
  playGains=new Map();
  decoded.forEach((b,i)=>{
    const l=layers[i],st=(l.offsetMs||0)/1000;
    const s=c.createBufferSource();s.buffer=b;
    const g=c.createGain();g.gain.value=shouldPlay(l.trackName)?(l.volume??1):0;
    s.connect(g);g.connect(c.destination);
    if(fromSec>=st){const sk=fromSec-st;if(sk<b.duration)s.start(now,sk);else return}
    else s.start(now+(st-fromSec));
    playSrcs.push(s);playGains.set(l.trackName,g);
  });
  isPlaying=true;
  document.getElementById('tp-play').classList.add('on');
  document.getElementById('tp-play').textContent='■';
  if(projectBPM&&clickOn){
    const beat=60/projectBPM,bi=Math.ceil(fromSec/beat-1e-6);
    startClick(projectBPM,Math.max(now+(bi*beat-fromSec),now),bi%4);
  }
  playFrom=fromSec;playStartCtx=c.currentTime;playDur=maxDur;
  playTick=setInterval(()=>{
    const el=playFrom+(ctx().currentTime-playStartCtx);
    document.getElementById('counter').textContent=fmtC(Math.min(el,playDur));
    const prog=Math.min(el/Math.max(playDur,.001),1);
    document.querySelectorAll('.phead').forEach(p=>{const w=p.parentElement;if(w)p.style.transform=`translateX(${Math.round(prog*w.offsetWidth)}px)`});
  },50);
  if(layers.length)playStopTO=setTimeout(()=>stopPlayback(),(maxDur-fromSec)*1000+300);
}
async function stopPlayback(){
  stopSrcs();stopClick();
  if(playTick){clearInterval(playTick);playTick=null}
  if(playStopTO){clearTimeout(playStopTO);playStopTO=null}
  if(isPlaying){
    isPlaying=false;
    document.getElementById('tp-play').classList.remove('on');
    document.getElementById('tp-play').textContent='▶';
    document.getElementById('counter').textContent='00:00.0';
    document.querySelectorAll('.phead').forEach(p=>p.style.transform='translateX(0)');
  }
}
function applyMix(){
  if(!isPlaying)return;
  playGains.forEach((g,name)=>{const l=getLayer(name);try{g.gain.value=shouldPlay(name)?(l?(l.volume??1):1):0}catch(e){}});
  if(clkGain&&clkRun){try{clkGain.gain.value=clickOn?CLICK_VOL:0}catch(e){}}
}

function renderDeck(){
  const host=document.getElementById('tracks');host.innerHTML='';
  TRACKS.forEach(t=>{
    const l=getLayer(t);
    const strip=document.createElement('div');
    strip.className='strip'+(l?' has-audio':'')+(armedTrack===t?' armed':'')+(isRecording&&armedTrack===t?' recording':'');
    const main=document.createElement('div');main.className='strip-main';
    const num=document.createElement('button');num.className='numeral';num.textContent=TRACK_LABEL[t];
    const ms=document.createElement('div');ms.className='ms';
    const mB=document.createElement('button');mB.className='msb'+(mutedTracks.has(t)?' m-on':'');mB.textContent='M';
    const sB=document.createElement('button');sB.className='msb'+(soloTrack===t?' s-on':'');sB.textContent='S';
    ms.appendChild(mB);ms.appendChild(sB);
    const ww=document.createElement('div');ww.className='wavewrap';
    const cv=document.createElement('canvas');cv.className='wave';
    const ph=document.createElement('div');ph.className='phead';
    ww.appendChild(cv);ww.appendChild(ph);
    if(!l){const e=document.createElement('div');e.className='empty-tag';e.textContent='ריק';ww.appendChild(e)}
    const nd=document.createElement('button');nd.className='nudge-btn'+(openDrawer===t?' open':'');nd.textContent='±';nd.style.visibility=l?'visible':'hidden';
    main.appendChild(num);main.appendChild(ms);main.appendChild(ww);main.appendChild(nd);
    strip.appendChild(main);
    const dr=document.createElement('div');dr.className='drawer'+(openDrawer===t?' open':'');
    if(l){
      const back=document.createElement('button');back.className='dr-btn';back.textContent='◀ −25ms';
      const val=document.createElement('div');val.className='dr-val';val.textContent=`${Math.round(l.offsetMs)}ms`;
      const fwd=document.createElement('button');fwd.className='dr-btn';fwd.textContent='+25ms ▶';
      dr.appendChild(back);dr.appendChild(val);dr.appendChild(fwd);
      back.addEventListener('click',()=>nudge(t,-25));
      fwd.addEventListener('click',()=>nudge(t,25));
    }
    strip.appendChild(dr);
    host.appendChild(strip);
    if(l)setTimeout(()=>drawWave(cv,l),0);
    num.addEventListener('click',()=>{
      if(isRecording)return;
      armedTrack=armedTrack===t?null:t;
      document.getElementById('tp-rec').disabled=!armedTrack;
      hint(armedTrack?(getLayer(armedTrack)?`● יחליף את ערוץ ${TRACK_LABEL[armedTrack]}`:`● יקליט לערוץ ${TRACK_LABEL[armedTrack]}`):'בחר ערוץ (1–4) כדי להקליט');
      renderDeck();
    });
    mB.addEventListener('click',()=>{mutedTracks.has(t)?mutedTracks.delete(t):mutedTracks.add(t);renderDeck();applyMix()});
    sB.addEventListener('click',()=>{soloTrack=soloTrack===t?null:t;renderDeck();applyMix()});
    nd.addEventListener('click',()=>{openDrawer=openDrawer===t?null:t;renderDeck()});
    ww.addEventListener('click',e=>{
      if(isRecording||!layers.length)return;
      const r=ww.getBoundingClientRect();
      startPlayback(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),true);
    });
    attachLongPressClear(strip,t,l);
  });
}
async function drawWave(cv,l){
  cv.width=cv.offsetWidth||300;cv.height=cv.offsetHeight||54;
  const g=cv.getContext('2d');g.fillStyle='#0e0b08';g.fillRect(0,0,cv.width,cv.height);
  try{
    const b=await dec(l);const pcm=b.getChannelData(0),step=Math.ceil(pcm.length/cv.width),mid=cv.height/2;
    g.strokeStyle='#f5a623';g.lineWidth=1.4;g.globalAlpha=.9;
    g.beginPath();
    for(let x=0;x<cv.width;x++){let m=0;for(let j=0;j<step;j++){const v=Math.abs(pcm[x*step+j]||0);if(v>m)m=v}const h=m*cv.height*.92;g.moveTo(x+.5,mid-h/2);g.lineTo(x+.5,mid+h/2)}
    g.stroke();g.globalAlpha=1;
  }catch(e){}
}
function nudge(t,d){
  const l=getLayer(t);if(!l)return;
  l.offsetMs=(l.offsetMs||0)+d;
  dbPut('layers',l);renderDeck();
  aiSay(`ערוץ ${TRACK_LABEL[t]} → ${Math.round(l.offsetMs)}ms`);
}
function attachLongPressClear(strip,t,l){
  if(!l)return;let tm=null,sx=0,sy=0;
  const onBtn=e=>e.target.closest('button')||e.target.closest('.wavewrap');
  const start=(x,y)=>{sx=x;sy=y;strip.style.transition='box-shadow .5s';strip.style.boxShadow='0 0 0 2px var(--rec)';tm=setTimeout(()=>{strip.style.boxShadow='';askClear(t)},550)};
  const stop=()=>{if(tm){clearTimeout(tm);tm=null}strip.style.boxShadow='';strip.style.transition=''};
  strip.addEventListener('touchstart',e=>{if(onBtn(e))return;start(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  strip.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-sx)>14||Math.abs(e.touches[0].clientY-sy)>14)stop()},{passive:true});
  strip.addEventListener('touchend',stop);strip.addEventListener('touchcancel',stop);
  strip.addEventListener('mousedown',e=>{if(onBtn(e))return;start(e.clientX,e.clientY)});
  strip.addEventListener('mouseup',stop);strip.addEventListener('mouseleave',stop);
}
let pendingClear=null;
function askClear(t){
  if(isRecording)return;
  pendingClear=t;
  document.getElementById('ovl-title').textContent=`לנקות ערוץ ${TRACK_LABEL[t]}?`;
  document.getElementById('ovl-sub').textContent='ההקלטה תימחק מהטייפ. אי אפשר לבטל.';
  document.getElementById('ovl').classList.add('open');
}
document.getElementById('ovl-no').addEventListener('click',()=>{document.getElementById('ovl').classList.remove('open');pendingClear=null});
document.getElementById('ovl').addEventListener('click',e=>{if(e.target.id==='ovl'){e.target.classList.remove('open');pendingClear=null}});
document.getElementById('ovl-yes').addEventListener('click',async()=>{
  const t=pendingClear;document.getElementById('ovl').classList.remove('open');pendingClear=null;
  if(t)await clearTrack(t);
});
async function clearTrack(t){
  const l=getLayer(t);if(!l)return;
  await stopPlayback();
  decodedCache.delete(l.id);await dbDel('layers',l.id);layers=layers.filter(x=>x.id!==l.id);
  if(soloTrack===t)soloTrack=null;mutedTracks.delete(t);
  if(openDrawer===t)openDrawer=null;
  renderDeck();aiSay(`ערוץ ${TRACK_LABEL[t]} נוקה`);
}

document.getElementById('tp-rec').addEventListener('click',()=>{isRecording?stopTake():startTake()});
document.getElementById('tp-play').addEventListener('click',()=>{if(isRecording)return;isPlaying?stopPlayback():startPlayback(0)});
document.getElementById('tp-click').addEventListener('click',()=>{
  clickOn=!clickOn;
  document.getElementById('tp-click').classList.toggle('on',clickOn);
  applyMix();
  if(isPlaying&&projectBPM&&clickOn&&!clkRun){
    const el=playFrom+(ctx().currentTime-playStartCtx),beat=60/projectBPM,bi=Math.ceil(el/beat);
    startClick(projectBPM,ctx().currentTime+(bi*beat-el),bi%4);
  }
  if(!clickOn)stopClick();
  aiSay(clickOn?'קליק פועל':'קליק כבוי');
});

const trackNum=s=>{const m=s.match(/[1-4]|אחד|שתיים|שניים|שלוש|ארבע/);if(!m)return null;
  return {'1':'t1','2':'t2','3':'t3','4':'t4','אחד':'t1','שתיים':'t2','שניים':'t2','שלוש':'t3','ארבע':'t4'}[m[0]]||null};
async function runLocalCommand(cmd){
  const c=cmd.trim();
  if(/בטל מיוט|unmute/i.test(c)){const t=trackNum(c);if(t){mutedTracks.delete(t);renderDeck();applyMix();return `ערוץ ${TRACK_LABEL[t]} חזר`}}
  if(/מיוט|השתק|mute/i.test(c)){const t=trackNum(c);if(t){mutedTracks.add(t);renderDeck();applyMix();return `ערוץ ${TRACK_LABEL[t]} מושתק`}}
  if(/סולו|solo/i.test(c)){const t=trackNum(c);if(t){soloTrack=soloTrack===t?null:t;renderDeck();applyMix();return soloTrack?`סולו ערוץ ${TRACK_LABEL[t]}`:'סולו בוטל'}}
  if(/נקה|מחק/.test(c)){const t=trackNum(c);if(t){askClear(t);return `מאשר ניקוי ערוץ ${TRACK_LABEL[t]}?`}}
  if(/הזז|יישר|תזיז/.test(c)){const t=trackNum(c);const ms=c.match(/(-?\d+)\s*ms|(-?\d+)\s*מילי/);
    if(t&&ms){const d=parseInt(ms[1]||ms[2],10)*(/אחורה|שמאלה/.test(c)?-1:1);nudge(t,d);return `הוזז ${d}ms`}
    if(t){nudge(t,/אחורה|שמאלה/.test(c)?-25:25);return 'הוזז 25ms'}}
  if(/קליק|מטרונום/.test(c)){
    if(/כבה|בלי|הסר|סגור/.test(c)){clickOn=false;document.getElementById('tp-click').classList.remove('on');applyMix();stopClick();return 'קליק כבוי'}
    clickOn=true;document.getElementById('tp-click').classList.add('on');applyMix();return 'קליק פועל';
  }
  if(/כיול|לטנסי|השהיה/.test(c)){showScreen('scr-calib');return 'פותח כיול'}
  if(/עצור|סטופ|stop/i.test(c)){await stopPlayback();if(isRecording)await stopTake();return 'עצרתי'}
  if(/נגן|פליי|play/i.test(c)){await startPlayback(0);return 'מנגן'}
  return null;
}
async function callAI(prompt){
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,state:{bpm:projectBPM,tracks:TRACKS.map(t=>({t,has:!!getLayer(t)}))}})});
    if(!r.ok)throw 0;return (await r.json()).message||'';
  }catch(e){
    console.log('[ai mock]',prompt);
    return 'הטכנאי המלא יגיע עם החיבור ל-API. בינתיים: נגן/עצור/מיוט/סולו/נקה/הזז/קליק';
  }
}
async function sendCmd(txt){
  if(!txt)return;document.getElementById('ai-in').value='';
  const local=await runLocalCommand(txt);
  if(local!==null){aiSay(local);return}
  aiSay('...');aiSay(await callAI(txt));
}
document.getElementById('ai-send').addEventListener('click',()=>sendCmd(document.getElementById('ai-in').value.trim()));
document.getElementById('ai-in').addEventListener('keydown',e=>{if(e.key==='Enter')sendCmd(e.target.value.trim())});
let recog=null;
if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();recog.lang='he-IL';recog.interimResults=false;
  recog.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('ai-in').value=t;sendCmd(t)};
  recog.onend=()=>document.getElementById('ai-mic').classList.remove('listening');
  recog.onerror=()=>document.getElementById('ai-mic').classList.remove('listening');
}
document.getElementById('ai-mic').addEventListener('click',()=>{
  if(!recog){aiSay('זיהוי קולי לא נתמך');return}
  document.getElementById('ai-mic').classList.add('listening');recog.start();
});

let dotsInt=null;
function pulseDots(){
  let i=0;return setInterval(()=>{
    document.querySelectorAll('.pulse-dot').forEach(d=>d.classList.remove('on'));
    const d=document.getElementById('pd'+(i%4));if(d)d.classList.add('on');i++;
  },60/curBPM*1000);
}
function bpmPreview(){killClick();startClick(curBPM);if(dotsInt)clearInterval(dotsInt);dotsInt=pulseDots()}
const setB=v=>{curBPM=Math.max(40,Math.min(220,v));document.getElementById('bpm-num').textContent=curBPM;bpmPreview()}
document.getElementById('b-m5').addEventListener('click',()=>setB(curBPM-5));
document.getElementById('b-m1').addEventListener('click',()=>setB(curBPM-1));
document.getElementById('b-p1').addEventListener('click',()=>setB(curBPM+1));
document.getElementById('b-p5').addEventListener('click',()=>setB(curBPM+5));
document.getElementById('b-ok').addEventListener('click',async()=>{
  killClick();if(dotsInt){clearInterval(dotsInt);dotsInt=null}
  projectBPM=curBPM;await dbPut('meta',{key:'project',bpm:projectBPM});
  document.getElementById('chip-bpm').textContent=`♩ ${projectBPM}`;
  const cal=await dbGet('meta','latency');
  if(cal&&typeof cal.ms==='number'){latencyMs=cal.ms;updateCalChip();showScreen('scr-deck');renderDeck()}
  else showScreen('scr-calib');
});
document.getElementById('chip-bpm').addEventListener('click',()=>{if(isRecording)return;curBPM=projectBPM||120;setB(curBPM);showScreen('scr-bpm')});

function updateCalChip(){const ch=document.getElementById('chip-cal');ch.textContent=`cal ${Math.round(latencyMs)}ms`;ch.classList.remove('dim')}
document.getElementById('chip-cal').addEventListener('click',()=>{if(!isRecording)showScreen('scr-calib')});
document.getElementById('calib-skip').addEventListener('click',async()=>{
  latencyMs=DEFAULT_LATENCY;await dbPut('meta',{key:'latency',ms:latencyMs});
  updateCalChip();showScreen('scr-deck');renderDeck();
});
document.getElementById('calib-run').addEventListener('click',async()=>{
  const meter=document.getElementById('calib-meter');
  meter.textContent='...';
  killClick();await stopPlayback();
  if(!await micOpen()){meter.textContent='—';return}
  if(masterCtx&&masterCtx.state!=='closed'){decodedCache.clear();await masterCtx.close();masterCtx=null;clkGain=null}
  const sr=22050,off=new OfflineAudioContext(1,Math.ceil(2.2*sr),sr);
  [0.4,1.0,1.6].forEach(t=>{const o=off.createOscillator(),g=off.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.9,t);g.gain.setValueAtTime(.9,t+.06);g.gain.exponentialRampToValueAtTime(1e-4,t+.07);o.connect(g);g.connect(off.destination);o.start(t);o.stop(t+.08)});
  const beepUrl=URL.createObjectURL(toWav(await off.startRendering()));
  recBegin();
  await new Promise(r=>setTimeout(r,250));
  const el=new Audio(beepUrl);el.volume=1;
  const playAt=Date.now();await el.play().catch(()=>{});
  await new Promise(r=>setTimeout(r,2500));
  const take=await recEnd();URL.revokeObjectURL(beepUrl);
  try{
    const t=new (window.AudioContext||window.webkitAudioContext)();
    const rec=await t.decodeAudioData(take.buffer.slice());await t.close();
    const o2=new OfflineAudioContext(1,rec.length,rec.sampleRate);
    const s=o2.createBufferSource();s.buffer=rec;
    const bp=o2.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1000;bp.Q.value=12;
    s.connect(bp);bp.connect(o2.destination);s.start(0);
    const f=await o2.startRendering();const d=f.getChannelData(0),frame=Math.round(f.sampleRate*.005);
    const env=[];for(let i=0;i<d.length;i+=frame){let m=0;for(let j=0;j<frame&&i+j<d.length;j++){const v=Math.abs(d[i+j]);if(v>m)m=v}env.push(m)}
    const peak=Math.max(...env),thr=peak*.5;
    const expectBase=(playAt-recStartMs)/1000;
    const found=[];
    [0.4,1.0,1.6].forEach(bt=>{
      const from=Math.max(0,Math.floor((expectBase+bt-0.05)/.005)),to=Math.min(env.length,Math.floor((expectBase+bt+0.6)/.005));
      for(let i=from;i<to;i++){if(env[i]>=thr){found.push(i*.005-(expectBase+bt));break}}
    });
    if(found.length<2||peak<0.02)throw 0;
    found.sort((a,b)=>a-b);
    const med=found[Math.floor(found.length/2)];
    latencyMs=Math.max(0,Math.min(500,Math.round(med*1000)));
    await dbPut('meta',{key:'latency',ms:latencyMs});
    meter.textContent=`${latencyMs}ms`;
    updateCalChip();
    setTimeout(()=>{showScreen('scr-deck');renderDeck()},900);
  }catch(e){
    meter.textContent='לא נקלט';
    aiSay('הגבר ווליום, הסר אוזניות ונסה שוב');
  }
});

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
async function init(){
  if(!sessionStorage.getItem('laylo-deck')){
    await new Promise(r=>{const q=indexedDB.deleteDatabase(DB_NAME);q.onsuccess=q.onerror=r});
    sessionStorage.setItem('laylo-deck','1');
  }
  await openDB();
  const proj=await dbGet('meta','project');
  const cal=await dbGet('meta','latency');
  layers=(await dbGetAll('layers')).filter(l=>TRACKS.includes(l.trackName));
  if(cal&&typeof cal.ms==='number'){latencyMs=cal.ms;updateCalChip()}
  document.getElementById('tp-click').classList.toggle('on',clickOn);
  if(proj?.bpm){
    projectBPM=proj.bpm;document.getElementById('chip-bpm').textContent=`♩ ${projectBPM}`;
    if(cal&&typeof cal.ms==='number'){showScreen('scr-deck');renderDeck()}
    else showScreen('scr-calib');
  }else{
    showScreen('scr-bpm');
  }
}
init().catch(console.error);

;(()=>{let t=null;const lg=document.getElementById('logo');
  lg.addEventListener('touchstart',e=>{e.preventDefault();t=setTimeout(()=>{indexedDB.deleteDatabase(DB_NAME);location.reload()},3000)},{passive:false});
  lg.addEventListener('touchend',()=>clearTimeout(t));lg.addEventListener('touchcancel',()=>clearTimeout(t));
})();
</script>
